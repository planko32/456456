<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Log In - EXARAI Style</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <style>
    :root {
      --bg: #020617;
      --shell-bg:#000;
      --card-bg: #000;
      --accent: #22c55e;
      --border-subtle: #1f2937;
      --border-strong: #111827;
      --text-main: #e5e7eb;
      --text-soft: #9ca3af;
      --error: #fb7185;
      --btn-disabled: #020617;
      --btn-text-disabled: #6b7280;
      --input-bg: #020617;
      --shadow-soft: 0 25px 70px rgba(15, 23, 42, 0.95);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: system-ui;
      background: #000;
      color: var(--text-main);
      display: flex;
      justify-content: center;
    }

    .page {
      width: 100%;
      max-width: 480px;
      background:#000;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 240px; /* نزلنا الصورة */
      background:linear-gradient(135deg,#000 0%,#000 100%);
      overflow: hidden;
    }

    .hero-center {
      position: absolute;
      inset:auto 0 20px 0; /* نزلنا */
      display:flex;
      flex-direction:column;
      align-items:center;
      text-align:center;
      padding:0 32px;
      z-index: 1;
    }

    .hero-logo {
      width: 82px;
      height: 82px;
      border-radius: 24px;
      background: radial-gradient(circle at 0 0, rgba(226, 232, 240, 0.96), transparent 55%),
                  radial-gradient(circle at 100% 0, rgba(134, 239, 172, 0.9), transparent 55%),
                  linear-gradient(145deg, #22c55e, #047857 55%, #020617 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      margin-bottom:10px;
    }

    .hero-logo-inner {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 25%, #e0f2fe,#22c55e 55%, #0f172a 95%);
      display:flex;
      justify-content:center;
      align-items:center;
      font-weight:800;
      font-size:18px;
    }

    .hero-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .hero-subtitle {
      font-size: 12px;
      color: rgba(226,232,240,0.95);
      line-height:1.45;
      max-width:260px;
    }

    .content {
      padding:18px 14px 22px;
      background:#000;
    }

    .card {
      background:#000;
      border-radius:24px;
      padding:18px 18px 20px;
      border:1px solid var(--border-strong);
      box-shadow:var(--shadow-soft);
    }

    .card-title {
      font-size:18px;
      font-weight:600;
      margin-bottom:4px;
    }

    .field-group { margin-bottom:14px; }

    .field-label {
      font-size:12px;
      color:var(--text-soft);
      margin-bottom:6px;
    }

    .phone-row {
      display:flex;
      gap:8px;
    }

    .select-country select,
    .input {
      width:100%;
      height:44px;
      border-radius:10px;
      border:1px solid var(--border-subtle);
      background:#030303;
      color:#fff;
      padding:0 12px;
    }

    .input::placeholder { color:#666; }

    .password-row {
      position:relative;
      display:flex;
      align-items:center;
    }

    .password-row input { padding-right:44px; }

    .password-toggle {
      position:absolute;
      right:10px;
      top:50%;
      transform:translateY(-50%);
      background:transparent;
      border:0;
      color:#999;
      cursor:pointer;
    }

    .options-row {
      display:flex;
      justify-content:space-between;
      margin:12px 0 14px;
    }

    .checkbox {
      display:flex;
      align-items:center;
      gap:6px;
      font-size:12px;
      color:var(--text-soft);
    }

    .btn-primary {
      width:100%;
      height:46px;
      border-radius:999px;
      background:#020617;
      color:#666;
      cursor:not-allowed;
    }

    .btn-primary--active {
      background:linear-gradient(135deg,#22c55e,#16a34a);
      color:#fff;
      cursor:pointer;
    }

    .agreement {
      margin-top:12px;
      font-size:11px;
      color:var(--text-soft);
    }

    .signup-row {
      margin-top:14px;
      font-size:12px;
      text-align:center;
      color:var(--text-soft);
    }

    a{color:#38bdf8;text-decoration:none;}

  </style>
</head>
<body>
  <div class="page">

    <header class="hero">
      <div class="hero-center">
        <div class="hero-logo">
          <div class="hero-logo-inner">E</div>
        </div>
        <div class="hero-title">EXARAI</div>
        <div class="hero-subtitle">
          Unleash your creativity with the power of EXARAI.
        </div>
      </div>
    </header>

    <main class="content">
      <section class="card">

        <h1 class="card-title">Log In</h1>

        <form id="loginForm" novalidate>

          <div class="field-group">
            <div class="field-label">Phone</div>
            <div class="phone-row">
              <div class="select-country">
                <select id="countryCode">
                  <option>+961</option>
                  <option>+966</option>
                </select>
              </div>
              <input id="phone" class="input" placeholder="Enter phone"/>
            </div>
          </div>

          <div class="field-group">
            <div class="field-label">Password</div>
            <div class="password-row">
              <input id="password" class="input" type="password" placeholder="At least 8 characters"/>
              <button type="button" class="password-toggle">👁</button>
            </div>
          </div>

          <div class="options-row">
            <label class="checkbox">
              <input type="checkbox" checked/>
              <span>Remember account</span>
            </label>

            <a href="#">Forgot Password?</a>
          </div>

          <button id="loginButton" class="btn-primary" disabled>
            Log In
          </button>

          <p class="agreement">
            By logging in, I agree to the TARM
            <a href="#">Service Agreement</a> and
            <a href="#">Privacy Policy</a>.
          </p>

          <div class="signup-row">
            <span>Don't have an account yet?</span>
            <a href="#">Sign Up</a>
          </div>

        </form>
      </section>
    </main>
  </div>


<script>
(function(){
 const phone=document.getElementById("phone");
 const pass=document.getElementById("password");
 const btn=document.getElementById("loginButton");

 function check(){
   if(phone.value.length>=6 && pass.value.length>=8){
     btn.disabled=false;
     btn.classList.add("btn-primary--active");
   }else{
     btn.disabled=true;
     btn.classList.remove("btn-primary--active");
   }
 }
 phone.oninput=check;
 pass.oninput=check;
})();
</script>

</body>
</html>
